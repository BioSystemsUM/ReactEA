[project]
name = "reactea"
version = "1.0.0"
description = "ReactEA: Combining Evolutionary Algorithms with Reaction Rules Towards Focused Molecular Design"
readme = "README.md"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
authors = [{ name = "João Correia", email = "jfscorreia95@gmail.com" }]
keywords = ["evolutionary-algorithms", "drug-discovery", "reaction-rules"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
requires-python = ">=3.11"
dependencies = [
    "rdkit>=2024.3",
    "numpy>=1.26",
    "pandas>=2.1",
    "cytoolz>=0.12",
    "jmetalpy>=1.9",
    "pyyaml>=6.0",
    "matplotlib>=3.8",
    "chembl-structure-pipeline>=1.2",
    "joblib>=1.3",
    "click>=8.1",
]

[project.urls]
Homepage = "https://github.com/BioSystemsUM/ReactEA"
Repository = "https://github.com/BioSystemsUM/ReactEA"

[project.scripts]
reactea = "reactea.cli:reactea_cli"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "mypy>=1.10",
    "flake8>=7",
]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
zip-safe = false
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true

[tool.setuptools.package-data]
reactea = ["py.typed"]
"reactea.data.reactionrules" = ["reaction_rules_reactea.tsv.bz2"]

[tool.pytest.ini_options]
addopts = "--cov=reactea"
pythonpath = [
  ".", "src", "tests"
]
testpaths = [
    "tests",
]

[tool.mypy]
mypy_path = "src"
check_untyped_defs = true
disallow_any_generics = true
ignore_missing_imports = true
no_implicit_optional = true
show_error_codes = true
strict_equality = true
warn_return_any = true
warn_unreachable = true
warn_unused_configs = true
no_implicit_reexport = true
implicit_reexport = true
