# Read the Docs configuration (https://docs.readthedocs.io/en/stable/config-file/v2.html)
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.13"
  jobs:
    # install ReactEA and the docs dependencies with uv (pinned in uv.lock)
    pre_create_environment:
      - asdf plugin add uv
      - asdf install uv latest
      - asdf global uv latest
    create_environment:
      - uv venv "${READTHEDOCS_VIRTUALENV_PATH}"
    install:
      - UV_PROJECT_ENVIRONMENT="${READTHEDOCS_VIRTUALENV_PATH}" uv sync --frozen --no-dev --group docs

sphinx:
  configuration: docs/conf.py
  fail_on_warning: true